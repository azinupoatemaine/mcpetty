name: Build & Push Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, development]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Only build when CI succeeded on a push (not PRs) to main/development
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Surfaced in the dashboard footer so a running instance can be identified — the image
      # tag is always :latest or :<branch> and says nothing about which commit is deployed.
      - name: Collect build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)"        >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"        >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_branch == 'main' && 'latest' || github.event.workflow_run.head_branch }}
          build-args: |
            BUILD_SHA=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
            BUILD_REF=${{ github.event.workflow_run.head_branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
